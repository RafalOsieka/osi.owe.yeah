# The osieka.dev instance (ADR 0005): PostgreSQL, a one-shot dump of it, the one-shot migrator,
# the app and the Cloudflare Tunnel that is its only way in. The app publishes no port.
#
# A template: CI fills in MIGRATOR_IMAGE and APP_IMAGE, pinned by digest, and commits the
# result to the `deploy` branch. Every other variable stays as written and is a secret or
# setting the host supplies; the README next to this file lists them. POSTGRES_PASSWORD and
# TUNNEL_TOKEN are required: the stack refuses to start without them.

# Every container's logs stay on the host, rotated at 10 MB × 3.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  # A new Postgres major can't open the old one's volume: it needs a dump and restore.
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: owe_yeah
    volumes:
      - pg-owe-yeah:/var/lib/postgresql
      # Read-only, so the runbook can `pg_restore` a dump from inside this container.
      - backups:/backups:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d owe_yeah']
      interval: 10s
      timeout: 5s
      retries: 5

  # Dumps the database before every deploy migrates it, since migrations only go forward. A
  # custom-format dump named by its UTC time; only the newest `keep` are kept. It's written under a
  # temporary name first, so a failed dump leaves no file that looks whole and pushes out none.
  backup:
    image: postgres:18-alpine
    restart: 'no'
    logging: *logging
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - backups:/backups
    command:
      - sh
      - -euc
      - |
        keep=5
        rm -f /backups/*.partial
        name="/backups/owe_yeah-$$(date -u +%Y%m%dT%H%M%SZ).dump"
        pg_dump -h db -U postgres -d owe_yeah -Fc -f "$$name.partial"
        mv "$$name.partial" "$$name"
        echo "Dumped to $$name"
        ls -1r /backups/*.dump | tail -n +$$((keep + 1)) | xargs -r rm -v --
    depends_on:
      db:
        condition: service_healthy

  # Runs to completion before `app` starts; a failed dump or migration keeps the app down.
  migrate:
    image: ghcr.io/rafalosieka/owe-yeah-migrator@sha256:a39d3109dfbdd45b3fe7dd08878b6a5dec930c3a906efc8decd8867448807286
    restart: 'no'
    logging: *logging
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/owe_yeah
    depends_on:
      db:
        condition: service_healthy
      backup:
        condition: service_completed_successfully

  app:
    image: ghcr.io/rafalosieka/owe-yeah@sha256:44b312513ab5c9df7ad7ac94ac5391c0052aee57cff225fb6f9bc58461be04d5
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/owe_yeah
      # Push notifications (#41): the VAPID key pair they are sent with, and the contact the
      # push services see. Without the keys, notifications can't be turned on.
      NUXT_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      NUXT_VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      NUXT_VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # A test environment, whose data may be wiped, says so in a banner on every screen (#105).
      NUXT_TEST_ENVIRONMENT: ${TEST_ENVIRONMENT:-false}
    # Healthy once `/healthz` answers, which takes the database answering too. The image
    # holds only Node, so Node's own fetch asks.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Connects out to Cloudflare and forwards the tunnel's public hostname to `http://app:3000`
  # over the compose network. The tunnel is remotely managed: its routes live in Cloudflare.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    logging: *logging
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      # Read from the environment, so the token never shows in the process list.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
      # The metrics server, local to the container, answers the healthcheck's `/ready`.
      TUNNEL_METRICS: 127.0.0.1:2000
    # Healthy while the tunnel holds at least one connection to Cloudflare.
    healthcheck:
      test: ['CMD', 'cloudflared', 'tunnel', 'ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pg-owe-yeah:
  # The `backup` dumps. Copy them off the host: on it alone, they share the database's fate.
  backups:
