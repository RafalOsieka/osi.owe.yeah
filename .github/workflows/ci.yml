name: PR CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run lint
        run: vp run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run format check
        run: vp run format:check

  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run type check
        run: vp run type-check

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run unit tests
        run: vp run test:unit

  nuxt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run Nuxt component tests
        run: vp run test:nuxt

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run build
        run: vp run build

  images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build migrator image
        run: docker build --target migrator --build-arg COMMIT_SHA="$GITHUB_SHA" --tag owe-yeah-migrator .

      - name: Build runtime image
        run: docker build --target runtime --build-arg COMMIT_SHA="$GITHUB_SHA" --tag owe-yeah-runtime .

      # Cached but for the commit, which falls back to `dev`.
      - name: Build runtime image without a commit
        run: docker build --target runtime --tag owe-yeah-runtime-dev .

      # Each image's `/healthz`, served against an empty database, reports the commit it was built with.
      - name: Check images report their commit
        run: |
          docker network create healthz
          docker run -d --name db --network healthz -e POSTGRES_PASSWORD=postgres postgres:18-alpine
          check() {
            image=$1 expected=$2
            docker run -d --name app --network healthz -p 3000:3000 \
              -e DATABASE_URL=postgres://postgres:postgres@db:5432/postgres "$image"
            for _ in $(seq 60); do
              health=$(curl -fsS http://localhost:3000/healthz) && break
              sleep 1
            done
            commit=$(echo "$health" | jq -r .commit)
            if [ "$commit" != "$expected" ]; then
              docker logs app
              echo "$image reports '$commit', expected '$expected'"
              exit 1
            fi
            docker rm -f app
          }
          check owe-yeah-runtime "$GITHUB_SHA"
          check owe-yeah-runtime-dev dev

      # The final images carry only `node`: no package manager or toolchain.
      - name: Check images hold no dev tooling
        run: |
          for image in owe-yeah-migrator owe-yeah-runtime; do
            docker run --rm --entrypoint sh "$image" -c \
              'for tool in npm npx pnpm yarn corepack vp; do if command -v "$tool"; then exit 1; fi; done'
          done

      # Both carry what their contents' licenses ask for (see docker/): the repo's license, a
      # source offer covering every Alpine package at its version, and the npm packages they
      # bundle or ship, with the full text of each license. The packages checked are traced
      # (`web-push`, `drizzle-orm`, `lru-cache`) or inlined into a bundle (`nuxt-security`, and
      # the migrator's two).
      - name: Check images carry their license notices
        run: |
          read_file() { docker run --rm --entrypoint cat "$1" "$2"; }
          fail() { echo "$1"; exit 1; }
          for image in owe-yeah-migrator owe-yeah-runtime; do
            read_file "$image" /app/notices/LICENSE | diff - LICENSE
            read_file "$image" /app/notices/THIRD-PARTY-NOTICES.md > "$image.md"
            read_file "$image" /app/notices/SOURCE-OFFER.md > offer.md
            grep -q '^## Written offer' offer.md
            # Into a file first: the default shell has no pipefail, so a failed read would
            # pass an empty list down a pipe.
            read_file "$image" /lib/apk/db/installed > installed
            grep -q '^P:busybox$' installed
            awk '/^P:/ { p = substr($0, 3) } /^V:/ { print "| " p " | " substr($0, 3) " |" }' installed |
              while read -r row; do
                grep -qF "$row" offer.md || fail "$image: the source offer lacks $row"
              done
          done
          # A package's notice, under the license it declares.
          has_package() {
            grep -qE "^## $2 - [^ ]+ \($3\)$" "$1.md" || fail "$1: no notice for $2 under $3"
          }
          # A license's full text under its heading in "License texts", by a phrase near its end.
          has_text() {
            awk -v heading="### $2" '$0 == heading { found = 1; next } /^### / { found = 0 } found' \
              "$1.md" > text.md
            grep -q "$3" text.md || fail "$1: no full $2 text"
          }
          has_package owe-yeah-migrator drizzle-orm Apache-2.0
          has_package owe-yeah-migrator postgres Unlicense
          has_text owe-yeah-migrator Apache-2.0 'END OF TERMS AND CONDITIONS'
          has_text owe-yeah-migrator Unlicense 'unencumbered'
          has_package owe-yeah-runtime web-push MPL-2.0
          has_package owe-yeah-runtime drizzle-orm Apache-2.0
          has_package owe-yeah-runtime lru-cache BlueOak-1.0.0
          has_package owe-yeah-runtime nuxt-security MIT
          has_text owe-yeah-runtime MPL-2.0 'Exhibit B'
          has_text owe-yeah-runtime Apache-2.0 'END OF TERMS AND CONDITIONS'
          has_text owe-yeah-runtime BlueOak-1.0.0 'No Liability'
          # The browser app's own, which the app serves (the api suite checks its contents).
          docker run --rm --entrypoint test owe-yeah-runtime -s /app/public/licenses.txt

      - name: Check images carry the OCI labels
        run: |
          for image in owe-yeah-migrator owe-yeah-runtime; do
            labels=$(docker inspect --format '{{json .Config.Labels}}' "$image")
            echo "$labels" | jq -e --arg sha "$GITHUB_SHA" '
              ."org.opencontainers.image.source" == "https://github.com/RafalOsieka/osi.owe.yeah"
              and ."org.opencontainers.image.licenses" == "MIT"
              and ."org.opencontainers.image.revision" == $sha
              and (."org.opencontainers.image.description" | length > 0)' > /dev/null ||
              { echo "$image: $labels"; exit 1; }
          done

  db:
    runs-on: ubuntu-latest
    needs: [lint, format, type-check, unit, nuxt, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # The suite starts its own postgres:18-alpine container through Docker.
      - name: Run database e2e tests
        run: vp run test:e2e:db

      # Server modules, each test file on a fresh, migrated database in that container.
      - name: Run database module tests
        run: vp run test:db

  api:
    runs-on: ubuntu-latest
    needs: [lint, format, type-check, unit, nuxt, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # Builds the app and serves it against its own postgres:18-alpine container.
      - name: Run API e2e tests
        run: vp run test:e2e:api

  ui:
    runs-on: ubuntu-latest
    needs: [lint, format, type-check, unit, nuxt, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: apps/web
        run: vp exec playwright install --with-deps chromium

      # Builds the app and serves it against its own postgres:18-alpine container.
      - name: Run UI e2e tests
        run: vp run test:e2e:ui

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  # Ships a green `main` to test (ADR 0005): pushes both images to GHCR, then commits the
  # osieka.dev compose, pinned to their digests, to the `deploy` branch, which the host polls.
  # The per-ref concurrency above cancels an older run on `main` before a newer one commits.
  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, format, type-check, unit, nuxt, build, images, db, api, ui]
    permissions:
      contents: write
      packages: write
    env:
      MIGRATOR_REPOSITORY: ghcr.io/rafalosieka/owe-yeah-migrator
      APP_REPOSITORY: ghcr.io/rafalosieka/owe-yeah
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # The images aren't distributed (ADR 0005). A package this push creates would take the
      # repository's visibility, public from its first push, so both are created private by hand
      # (see deploy/osieka-dev/README.md).
      - name: Check the packages exist and are private
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for repository in "$MIGRATOR_REPOSITORY" "$APP_REPOSITORY"; do
            scope="repository:${repository#ghcr.io/}:pull"
            # GHCR hands an anonymous pull token out only for a public package.
            if curl -fsS "https://ghcr.io/token?scope=$scope" > /dev/null 2>&1; then
              echo "$repository is public"
              exit 1
            fi
            # As this run, the package must already exist and let this repository in.
            token=$(curl -fsS -u "$GITHUB_ACTOR:$GITHUB_TOKEN" "https://ghcr.io/token?scope=$scope" | jq -r .token)
            if ! curl -fsS -H "Authorization: Bearer $token" "https://ghcr.io/v2/${repository#ghcr.io/}/tags/list" > /dev/null; then
              echo "$repository is missing, or this repository has no Actions access to it"
              exit 1
            fi
          done

      - name: Build and push images
        run: |
          docker build --target migrator --build-arg COMMIT_SHA="$GITHUB_SHA" \
            --tag "$MIGRATOR_REPOSITORY:$GITHUB_SHA" --push .
          docker build --target runtime --build-arg COMMIT_SHA="$GITHUB_SHA" \
            --tag "$APP_REPOSITORY:$GITHUB_SHA" --push .

      # Pinned to the digests GHCR holds, so the host runs exactly what was pushed.
      - name: Render the test compose
        run: |
          digest() { docker buildx imagetools inspect "$1:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -er .digest; }
          MIGRATOR_IMAGE="$MIGRATOR_REPOSITORY@$(digest "$MIGRATOR_REPOSITORY")"
          APP_IMAGE="$APP_REPOSITORY@$(digest "$APP_REPOSITORY")"
          export MIGRATOR_IMAGE APP_IMAGE
          # Only the two images: every other variable is a secret or setting the host supplies.
          # shellcheck disable=SC2016 # the list names the variables, unexpanded
          envsubst '${MIGRATOR_IMAGE} ${APP_IMAGE}' < deploy/osieka-dev/compose.yaml > "$RUNNER_TEMP/compose.yaml"
          # Putting the variables back must give the template again, secrets and all.
          sed -e "s|$MIGRATOR_IMAGE|\${MIGRATOR_IMAGE}|" -e "s|$APP_IMAGE|\${APP_IMAGE}|" "$RUNNER_TEMP/compose.yaml" |
            diff - deploy/osieka-dev/compose.yaml
          grep -qF "image: $MIGRATOR_IMAGE" "$RUNNER_TEMP/compose.yaml"
          grep -qF "image: $APP_IMAGE" "$RUNNER_TEMP/compose.yaml"

      # One commit per deploy, so the branch's history is the deploy log. Never forced: a push
      # that isn't a fast-forward fails rather than rewrite it.
      - name: Commit the test compose to deploy
        run: |
          message=$(git log -1 --format='Deploy %H to test%n%n%s')
          if git ls-remote --exit-code origin refs/heads/deploy; then
            git fetch --depth=1 origin deploy
            git switch --create deploy FETCH_HEAD
          else
            git switch --orphan deploy
          fi
          mkdir -p test
          cp "$RUNNER_TEMP/compose.yaml" test/compose.yaml
          git add test/compose.yaml
          if git diff --cached --quiet; then
            echo "test/compose.yaml on deploy already pins these images"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --message "$message"
          git push origin deploy

  # CI can't see the host pull a deploy, so it waits for test's `/healthz` to report the commit.
  # Off until the repository variable `TEST_URL` names test's public address.
  verify-deploy:
    runs-on: ubuntu-latest
    needs: publish
    if: vars.TEST_URL != ''
    steps:
      - name: Wait for test to run this commit
        env:
          TEST_URL: ${{ vars.TEST_URL }}
        run: |
          deadline=$((SECONDS + 15 * 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            # An answer that isn't JSON, such as Cloudflare's error page, fails `jq`: not yet.
            commit=$(curl -fsS --max-time 10 "$TEST_URL/healthz" | jq -r .commit) || commit=
            if [ "$commit" = "$GITHUB_SHA" ]; then
              exit 0
            fi
            echo "test runs '${commit:-nothing}', waiting for $GITHUB_SHA"
            sleep 30
          done
          echo "test didn't report $GITHUB_SHA within 15 minutes"
          exit 1
