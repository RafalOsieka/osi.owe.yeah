version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Vite+ pins vite, vitest and coverage together; upgrade them with `vp migrate`,
    # never one package at a time.
    ignore:
      - dependency-name: 'vite-plus'
      - dependency-name: 'vite'
      - dependency-name: 'vitest'
      - dependency-name: '@vitest/*'
      - dependency-name: '@voidzero-dev/*'
    groups:
      nuxt:
        patterns:
          - 'nuxt'
          - '@nuxt/*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  # The Node base image. The Vite+ build image follows the `vite-plus` catalog entry,
  # upgraded with `vp migrate` like the packages above.
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'ghcr.io/voidzero-dev/vite-plus'

  # The osieka.dev compose's Postgres and cloudflared. CI fills in the app's own two images.
  - package-ecosystem: 'docker-compose'
    directory: '/deploy/osieka-dev'
    schedule:
      interval: 'weekly'
